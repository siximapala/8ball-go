<div id="gameContainer">
  <div id="gameHeader">
    <div class="player-info">
      <span id="player1Info">Player 1: -</span>
      <span id="player2Info">Player 2: -</span>
    </div>

    <div class="game-id">
      Game ID: <span id="displayGameId">{{.gameID}}</span>
    </div>
  </div>

  <canvas id="billiardsTable"></canvas>

  <div id="controls">
    <div class="control-group">
      <label>
        Cue Power: <span id="powerValue">0</span>%
      </label>
      <input type="range" id="powerSlider" min="0" max="100" value="0">
    </div>
    <button id="shootBtn" disabled>Shoot!</button>
  </div>

  <div id="status"></div>

  <!-- данные для JS -->
  <div
    id="gameData"
    data-game-id="{{.gameID}}"
    data-player-name="{{.playerName}}">
  </div>
</div>

{{define "game.html"}}
<div class="game-layout">
    <aside class="gutter left-gutter">
        <div class="player-avatar">{{if .playerName}}<div class="you">You</div>{{end}}</div>
        <div class="power-rail" id="powerRail"></div>
    </aside>

    <main class="table-area">
        <div class="game-header">
            <div class="game-code">Game: <span id="displayGameId">{{.gameID}}</span></div>
            <div class="players-header">
                <!-- Исправьте эти строки: -->
                <span id="headerPlayer1" class="player-info-name">{{.player1}}</span>
                <span id="headerPlayer2" class="player-info-name">{{.player2}}</span>
            </div>
        </div>

        <canvas id="billiardsTable" aria-label="Billiards table"></canvas>

        <div id="status" class="status-line"></div>
    </main>

    <aside class="gutter right-gutter">
        <div class="players-list">
            <!-- Исправьте эти строки: -->
            <div id="gutterPlayer1" class="player">
                <span class="turn-indicator" aria-hidden="true"></span>
                <span class="player-name">{{.player1}}</span>
            </div>
            <div id="gutterPlayer2" class="player">
                <span class="turn-indicator" aria-hidden="true"></span>
                <span class="player-name">{{.player2}}</span>
            </div>
        </div>
    </aside>

    <script type="module" src="/static/js/script.js"></script>
    <script>
        (function waitInit() {
            if (window.initGame) {
                window.initGame('{{.gameID}}','{{.playerName}}');
            } else {
                setTimeout(waitInit, 50);
            }
        })();
    </script>
</div>
{{end}}

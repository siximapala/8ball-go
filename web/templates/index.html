<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎱 8-Ball Billiards</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🎱 8-Ball Billiards</h1>
        <div id="menu" class="menu">
            <div class="menu-section">
                <h2>Start New Game</h2>
                <form id="createGameForm">
                    <input type="text" id="playerName" placeholder="Your name" required>
                    <button type="submit">Create Game</button>
                </form>
            </div>
            
            <div class="menu-section">
                <h2>Join Existing Game</h2>
                <form id="joinGameForm">
                    <input type="text" id="joinPlayerName" placeholder="Your name" required>
                    <input type="text" id="gameId" placeholder="Game ID" required>
                    <button type="submit">Join Game</button>
                </form>
            </div>
        </div>
        
        <div id="gameContainer" style="display: none;">
            <div id="gameHeader">
                <div class="player-info">
                    <span id="player1Info">Player 1: -</span>
                    <span id="player2Info">Player 2: -</span>
                </div>
                <div class="game-id">Game ID: <span id="displayGameId"></span></div>
            </div>
            <canvas id="billiardsTable"></canvas>
            <div id="controls">
                <div class="control-group">
                    <label>Cue Power: <span id="powerValue">0</span>%</label>
                    <input type="range" id="powerSlider" min="0" max="100" value="0">
                </div>
                <button id="shootBtn" disabled>Shoot!</button>
            </div>
            <div id="status"></div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
    <script>
        document.getElementById('createGameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const playerName = document.getElementById('playerName').value;
            const gameId = Math.random().toString(36).substr(2, 8);
            
            fetch('/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `player_name=${encodeURIComponent(playerName)}&game_id=${gameId}`
            }).then(r => r.text()).then(html => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'flex';
                document.getElementById('displayGameId').textContent = gameId;
                initGame(gameId, playerName);
            });
        });

        document.getElementById('joinGameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const playerName = document.getElementById('joinPlayerName').value;
            const gameId = document.getElementById('gameId').value;
            
            fetch('/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `player_name=${encodeURIComponent(playerName)}&game_id=${gameId}`
            }).then(r => r.text()).then(html => {
                document.getElementById('menu').style.display = 'flex';
                document.getElementById('gameContainer').style.display = 'flex';
                document.getElementById('displayGameId').textContent = gameId;
                initGame(gameId, playerName);
            });
        });
    </script>
</body>
</html>

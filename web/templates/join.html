<div id="menu" class="menu">
  <div class="menu-section">
    <h2>Start New Game</h2>

    <form
      hx-post="/join"
      hx-target="#content"
      hx-swap="innerHTML"
    >
      <input name="player_name" placeholder="Your name" required>
      <input type="hidden" name="game_id" value="">
      <button type="submit">Create Game</button>
    </form>
  </div>

  <div class="menu-section">
    <h2>Join Existing Game</h2>

    <form
      hx-post="/join"
      hx-target="#content"
      hx-swap="innerHTML"
    >
      <input name="player_name" placeholder="Your name" required>
      <input name="game_id" placeholder="Game ID" required>
      <button type="submit">Join Game</button>
    </form>
  </div>
</div>
